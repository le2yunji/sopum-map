name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-backend-ec2.yml"
      - ".github/scripts/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-ec2
  cancel-in-progress: false

env:
  CI: true
  AWS_REGION: ap-northeast-2
  NODE_VERSION: 24.22.1
  PNPM_VERSION: 10.34.4
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  build-and-upload:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/sopum_map_test
      CLIENT_ORIGIN: http://127.0.0.1:3000
      KAKAO_REST_API_KEY: test-kakao-rest-api-key
      KAKAO_CLIENT_SECRET: test-kakao-client-secret
      KAKAO_REDIRECT_URI: http://127.0.0.1:4000/api/auth/kakao/callback
      NAVER_CLIENT_ID: test-naver-client-id
      NAVER_CLIENT_SECRET: test-naver-client-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --dir packages build

      - name: Test backend
        run: pnpm --dir backend test

      - name: Build backend
        run: pnpm --dir backend build

      - name: Create production release directory
        run: |
          rm -rf "$RUNNER_TEMP/release"

          pnpm \
            --filter backend \
            --prod \
            deploy \
            --legacy \
            "$RUNNER_TEMP/release"

          test -f "$RUNNER_TEMP/release/dist/server.js"
          test -d "$RUNNER_TEMP/release/node_modules"

      - name: Create deployment archive
        run: |
          ARCHIVE="$RUNNER_TEMP/sopum-api-${GITHUB_SHA}.tar.gz"

          tar \
            -C "$RUNNER_TEMP/release" \
            -czf "$ARCHIVE" \
            .

          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

          ls -lh "$ARCHIVE" "${ARCHIVE}.sha256"

      - name: Validate deployment variables
        run: |
          : "${AWS_ROLE_ARN:?AWS_ROLE_ARN repository variable is required}"
          : "${DEPLOY_BUCKET:?DEPLOY_BUCKET repository variable is required}"
          : "${EC2_INSTANCE_ID:?EC2_INSTANCE_ID repository variable is required}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsSopumMapBackendDeploy

      - name: Upload deployment files to S3
        run: |
          ARCHIVE="$RUNNER_TEMP/sopum-api-${GITHUB_SHA}.tar.gz"
          DEPLOY_SCRIPT=".github/scripts/deploy-backend-ec2.sh"
          DEPLOY_SCRIPT_CHECKSUM="$RUNNER_TEMP/deploy-backend-ec2.sh.sha256"
          S3_PREFIX="s3://${DEPLOY_BUCKET}/releases/${GITHUB_SHA}"

          (
            cd "$(dirname "$DEPLOY_SCRIPT")"
            sha256sum "$(basename "$DEPLOY_SCRIPT")" > "$DEPLOY_SCRIPT_CHECKSUM"
          )

          aws s3 cp \
            "$ARCHIVE" \
            "${S3_PREFIX}/sopum-api.tar.gz"

          aws s3 cp \
            "${ARCHIVE}.sha256" \
            "${S3_PREFIX}/sopum-api.tar.gz.sha256"

          aws s3 cp \
            "$DEPLOY_SCRIPT" \
            "${S3_PREFIX}/deploy-backend-ec2.sh"

          aws s3 cp \
            "$DEPLOY_SCRIPT_CHECKSUM" \
            "${S3_PREFIX}/deploy-backend-ec2.sh.sha256"

      - name: Deploy release with AWS Systems Manager
        id: deploy
        run: |
          bash .github/scripts/deploy-backend-via-ssm.sh \
            "$DEPLOY_BUCKET" \
            "$GITHUB_SHA" \
            "$EC2_INSTANCE_ID"

      - name: Write deployment summary
        run: |
          {
            echo "## Backend deployed to EC2"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Region: \`${AWS_REGION}\`"
            echo "- S3: \`s3://${DEPLOY_BUCKET}/releases/${GITHUB_SHA}/\`"
            echo "- EC2 instance: \`${EC2_INSTANCE_ID}\`"
            echo "- SSM command: \`${{ steps.deploy.outputs.command_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy artifact to EC2 with SSM
        id: deploy
        run: |
          COMMAND_ID="$(
            aws ssm send-command \
              --region "${AWS_REGION}" \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy sopum-map backend ${GITHUB_SHA}" \
              --timeout-seconds 600 \
              --parameters "{\"commands\":[\"/usr/local/bin/deploy-sopum-map-artifact ${GITHUB_SHA}\"]}" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "command-id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM command ID: ${COMMAND_ID}"

          STATUS="Pending"

          for attempt in {1..120}; do
            STATUS="$(
              aws ssm get-command-invocation \
                --region "${AWS_REGION}" \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query "Status" \
                --output text 2>/dev/null || true
            )"

            case "${STATUS}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
              Pending|InProgress|Delayed|"")
                sleep 5
                ;;
              *)
                echo "Unexpected SSM status: ${STATUS}"
                sleep 5
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '{
              Status:Status,
              ResponseCode:ResponseCode,
              StandardOutput:StandardOutputContent,
              StandardError:StandardErrorContent
            }'

          if [[ "${STATUS}" != "Success" ]]; then
            echo "Deployment failed with SSM status: ${STATUS}"
            exit 1
          fi
